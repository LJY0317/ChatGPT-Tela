name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - run: bun run workspace-files:test
      - run: bun run workspace-files:build
      - run: bun run verify
      - run: bun run codex:cleanup-test
      - run: bun run package:native-helper-test
      - run: bun run menu-bar:test
        if: runner.os == 'macOS'
      - run: bun run profile:runtime:build
      - run: bun run package:smoke
