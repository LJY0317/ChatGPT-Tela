[package]
name = "tela-operation-owner"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
tela-workspace-files = { path = "../workspace-files" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
getrandom = "0.3"
time = { version = "0.3", features = ["formatting"] }
libc = "0.2"
tokio = { version = "=1.52.3", features = ["rt", "net", "sync", "time", "io-util", "macros"] }
hyper = { version = "=1.8.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.3"
bytes = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
