[package]
name = "tela-workspace-files"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
cap-primitives = "=4.0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
